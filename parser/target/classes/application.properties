spring.application.name=parser
server.port=8081

# Base URL of the mco service (models/repository/controllers project)
mco.service.base-url=http://localhost:8082

# ===== Logging =====
logging.level.root=warn
logging.level.com.mcotools.parser=debug
logging.level.org.springframework.web=info

# Le chemin et la rotation des fichiers sont geres par logback-spring.xml
# (dossier partage MCOtools/logs avec le module mco)
