spring.application.name=mco
server.port=8082

# TODO: remplace par tes vrais identifiants de connexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mcotools
spring.datasource.username=postgres
spring.datasource.password=0699
# validate = ne touche pas au schema existant, verifie juste qu'il correspond aux entites
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===== Logging =====
# Niveaux par package : debug/info pour le code metier, warn pour spring/hibernate
logging.level.root=warn
logging.level.com.mcotools=debug
logging.level.org.springframework.web=info
logging.level.org.hibernate=warn

# Le chemin et la rotation des fichiers sont geres par logback-spring.xml
# (dossier partage MCOtools/logs avec le module parser)

