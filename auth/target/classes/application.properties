spring.application.name=auth
server.port=8084

# TODO: remplace par tes vrais identifiants de connexion PostgreSQL (meme base que mco)
spring.datasource.url=jdbc:postgresql://localhost:5432/mcotools
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===== Email (Gmail SMTP) =====
# TODO: remplace par le mot de passe d'application (16 caracteres, PAS le vrai
# mot de passe Gmail) genere sur myaccount.google.com/security
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL du frontend, utilisee pour construire le lien de confirmation envoye par email
app.frontend-url=http://localhost:3000

# ===== JWT =====
# TODO: en production, remplace par une valeur secrete generee aleatoirement (32+ caracteres)
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration-ms=86400000

# ===== Logging =====
logging.level.root=warn
logging.level.com.mcotools=debug
logging.level.org.springframework.web=info
logging.level.org.hibernate=warn
